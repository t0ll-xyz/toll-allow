[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./test/vectors" }]

[rpc_endpoints]
rh = "https://rpc.mainnet.chain.robinhood.com"
